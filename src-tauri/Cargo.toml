[package]
name = "oculus-desktop"
version = "0.1.0"
description = "OCULUS - Local-first document intelligence desktop application"
authors = ["Araskova"]
license = "Proprietary"
edition = "2021"

[lib]
name = "oculus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"
pkg-config = "0.3"

# Windows only: locate vcpkg-built static Tesseract/Leptonica (see build.rs).
[target.'cfg(windows)'.build-dependencies]
vcpkg = "0.2"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.45.0"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
