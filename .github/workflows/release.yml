name: Release

# Builds the macOS, Windows and Linux installers, after the UI and Rust tests pass on each system.
#  - Every push to main publishes them as a pre-release, "OCULUS <version> build <n>" (tag
#    v<version>-build.<n>), so the latest main can always be downloaded. Only the newest few build
#    pre-releases are kept.
#  - A version tag (git tag v0.2.0 && git push origin v0.2.0) opens a DRAFT release for review.
#  - "Run workflow" builds without publishing, which is a dry run.
# The Windows and Linux builds are best-effort: if one fails, the macOS release still goes out.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # changes that cannot affect the app do not rebuild it
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:

# A newer push to main replaces a build still running for an older one; tag builds always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Signing and notarisation are optional: without the Apple secrets the build is ad-hoc signed.
      HAVE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The interface is the araskova-doccraft submodule, checked out at the commit this one pins.
      # While that repository is private, SUBMODULE_SSH_KEY (a read-only deploy key on it) opens it;
      # without the secret (once public, or in pull requests from forks) the default token is used.
      - name: Interface commit
        id: ui
        shell: bash
        working-directory: .
        run: echo "sha=$(git rev-parse HEAD:araskova-doccraft)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ARASKOVA-labs/araskova-doccraft
          ref: ${{ steps.ui.outputs.sha }}
          path: araskova-doccraft
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}
          persist-credentials: false

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          [ "v$VERSION" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != tauri.conf.json version v$VERSION" >&2; exit 1; }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Native dependencies
        run: brew install tesseract leptonica pkg-config

      - name: UI dependencies and tests
        working-directory: araskova-doccraft
        run: |
          bun install --frozen-lockfile
          bun run test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Import signing certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the installer
        run: scripts/release_macos.sh

      - name: Notarise
        if: env.HAVE_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="$(ls dist-release/*.dmg)"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          (cd dist-release && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oculus-macos-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    # A Windows failure must never block the macOS release.
    continue-on-error: true
    timeout-minutes: 90
    env:
      # Optional Authenticode signing; without the secrets the installer is unsigned (SmartScreen warns).
      HAVE_WIN_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      # Static Tesseract/Leptonica from the runner's preinstalled vcpkg (see src-tauri/build.rs).
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
      RUST_BACKTRACE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The interface is the araskova-doccraft submodule, checked out at the commit this one pins.
      # While that repository is private, SUBMODULE_SSH_KEY (a read-only deploy key on it) opens it;
      # without the secret (once public, or in pull requests from forks) the default token is used.
      - name: Interface commit
        id: ui
        shell: bash
        working-directory: .
        run: echo "sha=$(git rev-parse HEAD:araskova-doccraft)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ARASKOVA-labs/araskova-doccraft
          ref: ${{ steps.ui.outputs.sha }}
          path: araskova-doccraft
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}
          persist-credentials: false

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME != tauri.conf.json version v$version" }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-tesseract-${{ runner.os }}-x64-windows-static-md-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-tesseract-${{ runner.os }}-x64-windows-static-md-

      - name: Native dependencies (vcpkg tesseract, static)
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vcpkg-cache" | Out-Null
          # The runner image ships vcpkg at C:\vcpkg (VCPKG_INSTALLATION_ROOT); build.rs finds it through VCPKG_ROOT.
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          "VCPKG_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:VCPKG_ROOT = $root
          Write-Host "vcpkg root: $env:VCPKG_ROOT"
          # [core] = Tesseract library only (no training tools, which pull in pango/ICU and take very long).
          & "$env:VCPKG_ROOT\vcpkg.exe" install "tesseract[core]:x64-windows-static-md" --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows-static-md\lib" -Filter *.lib | ForEach-Object Name

      - name: UI dependencies and tests
        working-directory: araskova-doccraft
        run: |
          bun install --frozen-lockfile
          bun run test

      # Informational on Windows: some integration tests rasterise PDFs, which Windows does not support yet.
      - name: Rust tests
        continue-on-error: true
        env:
          TESSDATA_PREFIX: ${{ github.workspace }}\tessdata
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast -- --test-threads=1

      - name: Build the installer
        run: scripts/release_windows.ps1

      - name: Sign the installer
        if: env.HAVE_WIN_SIGNING == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe not found' }
            $exe = (Get-ChildItem dist-release\*-setup.exe).FullName
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
            & $signtool.FullName verify /pa $exe
            $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$exe.sha256", "$hash  $(Split-Path $exe -Leaf)`n")
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oculus-windows-x64
          path: dist-release/*
          if-no-files-found: error

      - name: Collect build logs
        if: failure()
        run: |
          New-Item -ItemType Directory -Force -Path build-logs/vcpkg, build-logs/cargo | Out-Null
          Get-ChildItem "$env:VCPKG_ROOT\buildtrees" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName ("build-logs/vcpkg/" + $_.Directory.Name + "-" + $_.Name) -ErrorAction SilentlyContinue }
          Get-ChildItem target -Recurse -Include output, stderr -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'build\\oculus-desktop' } |
            ForEach-Object { Copy-Item $_.FullName ("build-logs/cargo/" + $_.Directory.Name + "-" + $_.Name) -ErrorAction SilentlyContinue }

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-logs
          path: build-logs/
          if-no-files-found: ignore

  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    # A Linux failure must never block the macOS release.
    continue-on-error: true
    timeout-minutes: 60
    env:
      # Tesseract needs the language data; the repo carries English, Malayalam and orientation data.
      TESSDATA_PREFIX: ${{ github.workspace }}/tessdata
      # AppImage tooling runs without FUSE (not available on hosted runners); strip is unneeded.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
      # Some Linux containers resolve "localhost" to an address the prerender preview server is not
      # listening on, which fails the static UI build with ECONNREFUSED. IPv4 first avoids it.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The interface is the araskova-doccraft submodule, checked out at the commit this one pins.
      # While that repository is private, SUBMODULE_SSH_KEY (a read-only deploy key on it) opens it;
      # without the secret (once public, or in pull requests from forks) the default token is used.
      - name: Interface commit
        id: ui
        shell: bash
        working-directory: .
        run: echo "sha=$(git rev-parse HEAD:araskova-doccraft)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ARASKOVA-labs/araskova-doccraft
          ref: ${{ steps.ui.outputs.sha }}
          path: araskova-doccraft
          ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}
          persist-credentials: false

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          [ "v$VERSION" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != tauri.conf.json version v$VERSION" >&2; exit 1; }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Ubuntu 22.04 (not latest) on purpose: the binary links against that release's glibc, so the
      # AppImage and .deb also run on newer distributions. Tesseract here is 4.1 (libtesseract4).
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libtesseract-dev libleptonica-dev

      - name: UI dependencies and tests
        working-directory: araskova-doccraft
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test

      # PDF page rendering is macOS-only for now, so the tests that need it are #[ignore]d here.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

      - name: Build the packages
        run: scripts/release_linux.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oculus-linux-x64
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build-macos, build-windows, build-linux]
    # Runs when macOS built, even if the (best-effort) Windows or Linux build failed or was skipped.
    if: ${{ !cancelled() && needs.build-macos.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Release name
        id: rel
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=OCULUS ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=OCULUS ${VERSION} build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: oculus-*
          merge-multiple: true
          path: dist
      - name: Release notes
        run: |
          ls -l dist
          : > release-notes.md
          if [ "${{ steps.rel.outputs.build }}" = "true" ]; then
            cat >> release-notes.md <<EOF
          Automatic build of \`main\` at ${GITHUB_SHA::7}. It passed the interface and Rust tests, but it is a
          pre-release: for everyday use, take the newest release without "build" in its name.

          EOF
          fi
          if ls dist/*-setup.exe >/dev/null 2>&1; then
            cat >> release-notes.md <<'EOF'
          ## Windows
          Every tool works on Windows. Scanned PDFs are read by drawing their pages in the app first, which is slower than on macOS for long documents.
          The installer is not code-signed unless stated otherwise: Windows SmartScreen may warn, choose "More info", then "Run anyway".

          EOF
          else
            cat >> release-notes.md <<'EOF'
          ## Windows
          The Windows build did not complete for this tag, so this release has no Windows installer. See the workflow run's build logs.

          EOF
          fi
          if ls dist/*.AppImage dist/*.deb >/dev/null 2>&1; then
            cat >> release-notes.md <<'EOF'
          ## Linux
          `*.AppImage` carries its own libraries and runs on x86-64 distributions from 2022 or newer (Ubuntu 22.04, Debian 12, Fedora 36 and later): make it executable (`chmod +x`) and run it.
          `*.deb` is for Ubuntu 22.04 and derivatives, which ship the Tesseract 4 library it needs (`sudo apt install ./OCULUS_*.deb`).
          Every tool works on Linux. Like Windows, scanned PDFs are read by drawing their pages in the app first.
          EOF
          else
            cat >> release-notes.md <<'EOF'
          ## Linux
          The Linux build did not complete for this tag, so this release has no Linux packages. See the workflow run's build logs.
          EOF
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ steps.rel.outputs.build != 'true' }}
          prerelease: ${{ steps.rel.outputs.build == 'true' }}
          make_latest: ${{ steps.rel.outputs.build == 'true' && 'false' || 'true' }}
          generate_release_notes: ${{ steps.rel.outputs.build != 'true' }}
          body_path: release-notes.md
          files: dist/*

      # Keep the five newest build pre-releases (and their tags); version releases are never touched.
      - name: Remove older builds
        if: steps.rel.outputs.build == 'true'
        run: |
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-build\\.[0-9]+$")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
