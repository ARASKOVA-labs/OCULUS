[workspace]
members = [
    "src-tauri"
]
resolver = "2"

# Release builds: smaller, symbol-free, harder to read back. Debug builds are unaffected.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# unwind, not abort: a malformed PDF that makes the PDF library panic then gives an error message
# (the commands catch it on their worker thread) instead of closing the app
panic = "unwind"
