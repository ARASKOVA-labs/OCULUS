name: Idea or new tool
description: Suggest a tool, a format, or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: The task, in your words. "I need to turn my bank's .ofx export into a spreadsheet" is more useful than a feature name.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
